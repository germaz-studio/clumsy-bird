Summary: Clumsy Bird - Flappy Bird clone ported to Android
Description: |-
  Clumsy Bird is a fun and lightweight Flappy Bird clone originally built with MelonJS.
  This version is ported to Android for F-Droid by Oskar Gerlicz-Kowalczuk (Germaz Studio).

  Features:
  - Fullscreen edge-to-edge scaling with zero letterboxing
  - Minimalist [germaz studio] intro screen
  - Responsive touch controls (tap anywhere to flap wings)
  - Dedicated on-screen sound mute toggle
  - High score tracking
  - Fully offline, zero telemetry, zero proprietary dependencies
  - 100% Free and Open Source (GNU GPL v3.0)

  Credits:
  * Original game and assets by Ellison Leão
  * Android port and mobile adaptations by Oskar Gerlicz-Kowalczuk (Germaz Studio)


<!DOCTYPE HTML>
<html lang="en">
    <head>
        <title>Clumsy Bird - Germaz Studio</title>
        <link rel="apple-touch-icon-precomposed" href="data/img/touch-icon-iphone.png"/>
        <link rel="apple-touch-icon-precomposed" sizes="120x120" href="data/img/touch-icon-iphone-retina.png"/>
        <link rel="shortcut icon" href="data/img/favicon.ico">
        <link rel="stylesheet" type="text/css" media="screen" href="index.css">
        <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black">
        <meta name="apple-mobile-web-app-title" content="Clumsy Bird">
        <meta charset="UTF-8" />
        <meta name="description" content="Clumsy Bird - Ported to Android by Oskar Gerlicz-Kowalczuk (Germaz Studio)"/>
    </head>

    <body>
        <!-- [germaz studio] Adult Swim style Splash Screen -->
        <div id="germaz-splash">
            <span class="as-logo">[germaz studio]</span>
        </div>

        <!-- Touch Mute Button -->
        <button id="mobile-mute-btn" title="Mute / Unmute Sound">🔊</button>

        <!-- Canvas placeholder -->
        <div id="screen"></div>

        <!-- melonJS Library & Scripts -->
        <script type="text/javascript" src="js/melonJS-min.js"></script>
        <script type="text/javascript" src="js/game.js"></script>
        <script type="text/javascript" src="js/entities/entities.js"></script>
        <script type="text/javascript" src="js/entities/HUD.js"></script>
        <script type="text/javascript" src="js/screens/title.js"></script>
        <script type="text/javascript" src="js/screens/play.js"></script>
        <script type="text/javascript" src="js/screens/gameover.js"></script>
        <script type="text/javascript">
            // [germaz studio] splash screen logic & audio unblock
            (function() {
                var splash = document.getElementById("germaz-splash");
                var muteBtn = document.getElementById("mobile-mute-btn");
                var dismissed = false;

                function dismissSplash() {
                    if (dismissed) return;
                    dismissed = true;
                    if (splash) {
                        splash.classList.add("fade-out");
                        setTimeout(function() {
                            if (splash.parentNode) splash.parentNode.removeChild(splash);
                        }, 500);
                    }
                    if (window.me && window.me.audio) {
                        try {
                            me.audio.resume();
                        } catch(e) {}
                    }
                }

                if (splash) splash.addEventListener("click", dismissSplash);

                // Auto-advance after 1.8s or tap
                setTimeout(dismissSplash, 1800);

                // Obsługa wyciszenia na ekranie dotykowym
                if (muteBtn) {
                    muteBtn.addEventListener("click", function(e) {
                        e.stopPropagation();
                        if (window.game && window.me && window.me.audio) {
                            game.data.muted = !game.data.muted;
                            if (game.data.muted) {
                                me.audio.disable();
                                muteBtn.innerText = "🔇";
                                muteBtn.classList.add("muted");
                            } else {
                                me.audio.enable();
                                muteBtn.innerText = "🔊";
                                muteBtn.classList.remove("muted");
                            }
                        }
                    });
                }
            })();

            window.onReady(function onReady() {
                game.onload();
            });
        </script>
    </body>
</html>
